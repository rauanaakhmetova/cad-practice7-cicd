name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: npm test

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Build and push image tagged with the commit SHA
        run: |
          REPO=${{ vars.ECR_REPO }}
          aws ecr get-login-password | docker login -u AWS --password-stdin ${REPO%%/*}
          docker build -t $REPO:$GITHUB_SHA .
          docker push $REPO:$GITHUB_SHA

      - name: Deploy CloudFormation stack with the new tag
        run: |
          VPC=$(aws ec2 describe-vpcs --filters Name=is-default,Values=true --query 'Vpcs[0].VpcId' --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters Name=default-for-az,Values=true --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          aws cloudformation deploy --stack-name p7-app --template-file app.yaml \
            --parameter-overrides ImageRepo=${{ vars.ECR_REPO }} ImageTag=$GITHUB_SHA VpcId=$VPC Subnets=$SUBNETS \
            --capabilities CAPABILITY_NAMED_IAM --no-fail-on-empty-changeset
